<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Հարսանեկան Հրավիրատոմս</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Armenian:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-gold: #c5a059;
            --accent-gold: #e6ca65;
            --dark-gold: #8e6d27;
            --soft-bg: #faf7f2;
            --card-bg: rgba(255, 255, 255, 0.94);
            --text-dark: #2c2520;
            --text-muted: #6b5e52;
            --border-gold: rgba(197, 160, 89, 0.4);
            --shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: 'Noto Serif Armenian', serif;
            background-color: var(--soft-bg);
            color: var(--text-dark);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* 100% Fullscreen Hero Section - Responsive on all devices */
        .hero {
            position: relative;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 24px;
            background: linear-gradient(135deg, rgba(250, 247, 242, 0.88), rgba(243, 235, 222, 0.96));
            overflow: hidden;
        }

        /* Ambient Botanical Ornaments */
        .floral-decor {
            position: absolute;
            pointer-events: none;
            z-index: 1;
            opacity: 0.28;
        }

        .floral-top-left {
            top: -40px;
            left: -40px;
            width: 280px;
            transform: rotate(-10deg);
        }

        .floral-bottom-right {
            bottom: -40px;
            right: -40px;
            width: 280px;
            transform: rotate(170deg);
        }

        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 650px;
            width: 100%;
            animation: fadeIn 1.2s ease-out;
        }

        .hero-subtitle {
            font-size: 1.15rem;
            letter-spacing: 2px;
            color: var(--dark-gold);
            margin-bottom: 12px;
            font-weight: 600;
        }

        .hero-title {
            font-size: 2.8rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 18px;
            line-height: 1.25;
        }

        .hero-divider {
            width: 120px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary-gold), transparent);
            margin: 18px auto;
        }

        .hero-description {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 32px;
        }

        .scroll-btn {
            display: inline-block;
            padding: 16px 38px;
            background: linear-gradient(135deg, var(--primary-gold), var(--dark-gold));
            color: #ffffff;
            text-decoration: none;
            border-radius: 30px;
            font-weight: 600;
            font-size: 1.05rem;
            box-shadow: 0 8px 22px rgba(197, 160, 89, 0.35);
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
        }

        .scroll-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(197, 160, 89, 0.45);
        }

        /* Form Container Section */
        .form-section {
            position: relative;
            padding: 80px 20px;
            max-width: 620px;
            margin: 0 auto;
        }

        .form-wrapper {
            position: relative;
            width: 100%;
        }

        /* Floral Ornaments Peeking Out From Behind Card */
        .card-decor-left {
            position: absolute;
            top: -45px;
            left: -45px;
            width: 170px;
            z-index: 1;
            opacity: 0.75;
            pointer-events: none;
        }

        .card-decor-right {
            position: absolute;
            bottom: -45px;
            right: -45px;
            width: 170px;
            z-index: 1;
            opacity: 0.75;
            pointer-events: none;
            transform: rotate(180deg);
        }

        .form-card {
            position: relative;
            background: var(--card-bg);
            border: 1px solid var(--border-gold);
            border-radius: 24px;
            padding: 40px 32px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(12px);
            z-index: 2;
        }

        .form-title {
            font-size: 2.1rem;
            text-align: center;
            color: var(--text-dark);
            margin-bottom: 8px;
            font-weight: 700;
        }

        .form-subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 32px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-dark);
            font-size: 0.95rem;
        }

        .form-control {
            width: 100%;
            padding: 14px 18px;
            border: 1px solid var(--border-gold);
            border-radius: 14px;
            background-color: #ffffff;
            font-family: inherit;
            font-size: 1rem;
            color: var(--text-dark);
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary-gold);
            box-shadow: 0 0 0 4px rgba(197, 160, 89, 0.18);
        }

        textarea.form-control {
            resize: vertical;
            min-height: 100px;
        }

        .radio-group {
            display: flex;
            gap: 16px;
            margin-top: 6px;
        }

        .radio-option {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            background: #ffffff;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid var(--border-gold);
            flex: 1;
            transition: all 0.2s ease;
        }

        .radio-option:hover {
            border-color: var(--primary-gold);
        }

        .radio-option input {
            accent-color: var(--primary-gold);
            width: 18px;
            height: 18px;
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--primary-gold), var(--dark-gold));
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 1.1rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            box-shadow: 0 8px 22px rgba(197, 160, 89, 0.3);
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 26px rgba(197, 160, 89, 0.4);
        }

        .status-message {
            margin-top: 20px;
            padding: 14px;
            border-radius: 12px;
            text-align: center;
            display: none;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .status-success {
            background-color: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #a5d6a7;
        }

        .status-error {
            background-color: #ffebee;
            color: #c62828;
            border: 1px solid #ef9a9a;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 600px) {
            .hero-title {
                font-size: 2.1rem;
            }
            .form-card {
                padding: 28px 20px;
            }
            .card-decor-left {
                width: 110px;
                top: -30px;
                left: -25px;
            }
            .card-decor-right {
                width: 110px;
                bottom: -30px;
                right: -25px;
            }
            .radio-group {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>

    <!-- FULLSCREEN HERO SECTION -->
    <section class="hero">
        <svg class="floral-decor floral-top-left" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M40,100 C20,50 80,20 100,40 C120,60 160,20 180,60 C200,100 150,140 130,120 C110,100 70,150 40,100 Z" stroke="#c5a059" stroke-width="2" fill="none"/>
            <circle cx="100" cy="40" r="7" fill="#c5a059" opacity="0.5"/>
            <circle cx="180" cy="60" r="5" fill="#c5a059" opacity="0.5"/>
            <path d="M10,100 Q90,90 100,10" stroke="#8e6d27" stroke-width="1.5"/>
        </svg>

        <svg class="floral-decor floral-bottom-right" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M40,100 C20,50 80,20 100,40 C120,60 160,20 180,60 C200,100 150,140 130,120 C110,100 70,150 40,100 Z" stroke="#c5a059" stroke-width="2" fill="none"/>
            <circle cx="100" cy="40" r="7" fill="#c5a059" opacity="0.5"/>
            <circle cx="180" cy="60" r="5" fill="#c5a059" opacity="0.5"/>
            <path d="M10,100 Q90,90 100,10" stroke="#8e6d27" stroke-width="1.5"/>
        </svg>

        <div class="hero-content">
            <div class="hero-subtitle">Սիրով հրավիրում ենք</div>
            <h1 class="hero-title">Մեր Հարսանեկան Հանդեսին</h1>
            <div class="hero-divider"></div>
            <p class="hero-description">Խնդրում ենք հաստատել ձեր մասնակցությունը՝ լրացնելով ստորև ներկայացված հայտը։</p>
            <button class="scroll-btn" onclick="document.getElementById('rsvp-section').scrollIntoView({behavior: 'smooth'})">Հաստատել Մասնակցությունը</button>
        </div>
    </section>

    <!-- FORM SECTION -->
    <section class="form-section" id="rsvp-section">
        <div class="form-wrapper">
            <svg class="card-decor-left" viewBox="0 0 150 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M10 180 C 30 120, 80 80, 140 20" stroke="#c5a059" stroke-width="2"/>
                <path d="M20 190 C 50 140, 100 100, 150 40" stroke="#8e6d27" stroke-width="1"/>
                <circle cx="140" cy="20" r="10" fill="#c5a059" opacity="0.4"/>
                <circle cx="100" cy="60" r="7" fill="#c5a059" opacity="0.5"/>
            </svg>

            <svg class="card-decor-right" viewBox="0 0 150 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M10 180 C 30 120, 80 80, 140 20" stroke="#c5a059" stroke-width="2"/>
                <path d="M20 190 C 50 140, 100 100, 150 40" stroke="#8e6d27" stroke-width="1"/>
                <circle cx="140" cy="20" r="10" fill="#c5a059" opacity="0.4"/>
            </svg>

            <div class="form-card">
                <h2 class="form-title">Մասնակցության Հաստատում</h2>
                <p class="form-subtitle">Լրացրեք տվյալները՝ աղյուսակում պահպանվելու համար</p>

                <form id="weddingForm">
                    <div class="form-group">
                        <label for="fullName">Անուն, ազգանուն։ *</label>
                        <input type="text" id="fullName" name="fullName" class="form-control" placeholder="Օրինակ՝ Արմեն Գրիգորյան" required>
                    </div>

                    <div class="form-group">
                        <label for="phone">Հեռախոսահամար։ *</label>
                        <input type="tel" id="phone" name="phone" class="form-control" placeholder="+374 99 000000" required>
                    </div>

                    <div class="form-group">
                        <label>Կկարողանա՞ք ներկա գտնվել։ *</label>
                        <div class="radio-group">
                            <label class="radio-option">
                                <input type="radio" name="attendance" value="Այո, սիրով" checked> Այո, սիրով
                            </label>
                            <label class="radio-option">
                                <input type="radio" name="attendance" value="Ցավոք չեմ կարող"> Ցավոք չեմ կարող
                            </label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="guestCount">Մասնակիցների քանակ։</label>
                        <input type="number" id="guestCount" name="guestCount" class="form-control" min="1" value="1">
                    </div>

                    <div class="form-group">
                        <label for="notes">Լրացուցիչ նշումներ։</label>
                        <textarea id="notes" name="notes" class="form-control" placeholder="Գրեք ձեր մաղթանքը կամ նշումները..."></textarea>
                    </div>

                    <button type="submit" class="submit-btn" id="submitBtn">Ուղարկել Հայտը</button>

                    <div id="statusMessage" class="status-message"></div>
                </form>
            </div>
        </div>
    </section>

    <script>
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzfLPosKvtJgMGvuzeVJF6yLgTnBTnq7pUOqKAQk1ZUgwXp6Hh8-1XueWf4Ub0GuCJ6/exec";

        document.getElementById('weddingForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const statusMsg = document.getElementById('statusMessage');
            
            submitBtn.disabled = true;
            submitBtn.textContent = 'Ուղարկվում է...';
            statusMsg.style.display = 'none';

            const formData = {
                fullName: document.getElementById('fullName').value,
                phone: document.getElementById('phone').value,
                attendance: document.querySelector('input[name="attendance"]:checked').value,
                guestCount: document.getElementById('guestCount').value,
                notes: document.getElementById('notes').value
            };

            fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(formData)
            })
            .then(response => {
                statusMsg.className = 'status-message status-success';
                statusMsg.textContent = 'Շնորհակալություն։ Ձեր հայտը հաջողությամբ գրանցվեց։';
                statusMsg.style.display = 'block';
                document.getElementById('weddingForm').reset();
            })
            .catch(error => {
                statusMsg.className = 'status-message status-error';
                statusMsg.textContent = 'Սխալ տեղի ունեցավ։ Խնդրում ենք փորձել նորից։';
                statusMsg.style.display = 'block';
            })
            .finally(() => {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Ուղարկել Հայտը';
            });
        });
    </script>
</body>
</html>
